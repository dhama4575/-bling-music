<style>
:root{--g:#f5b82e;--c:#121212;--c2:#1d1d1d;--m:#9a9a9a;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;color:#fff;font:15px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:linear-gradient(#1a1305,#000)}

main{flex:1;overflow-y:auto;padding:8px 16px 24px}
h2{font-size:17px;margin:18px 0 8px}

.m{color:var(--m);padding:8px 0}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1a1a1a}
.cv{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#3a2a05,var(--g));overflow:hidden;flex:none;position:relative}

.tx{flex:1;min-width:0}.tx b,.tx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ic{background:none;border:0;font-size:20px;min-width:40px;height:40px;color:#ddd}.ic.on{color:var(--g)}
.btn{background:var(--g);color:#000;border:0;border-radius:10px;padding:12px 16px;font-weight:700;width:100%;margin:6px 0}
.btn.s{background:var(--c2);color:#fff}
input,select,textarea{background:var(--c);border:1px solid #2a2a2a;border-radius:10px;padding:12px;width:100%;margin:6px 0}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--g)}
nav{display:flex;border-top:1px solid #1d1d1d;background:#0a0a0a;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--m);padding:8px 0;font-size:10px}
nav button i{display:block;font-style:normal;font-size:20px}nav .on{color:var(--g)}
#mini{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#161616;position:relative}
#mbar{position:absolute;left:0;top:0;height:2px;background:var(--g);width:0}
#sheet{position:fixed;inset:0;background:radial-gradient(#2a1d03,#000 70%);z-index:5;padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 12px);overflow-y:auto}
#sheet .big{width:min(78vw,340px);aspect-ratio:1;height:auto;margin:12px auto;border-radius:16px}
.ctl{display:flex;justify-content:space-around;align-items:center;margin:8px 0}.ctl .ic{font-size:26px}
#spp{background:var(--g);color:#000;border-radius:50%;width:64px;height:64px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chips button{flex:none;background:var(--c2);border:1px solid #2a2a2a;border-radius:20px;padding:8px 14px}
#toast{position:fixed;left:16px;right:16px;bottom:150px;background:var(--g);color:#000;padding:12px;border-radius:10px;z-index:9;font-weight:600}
#auth{position:fixed;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top) + 24px) 24px 24px;background:#000;z-index:8}
#auth>div{max-width:420px;margin:auto}#auth img{width:170px;display:block;margin:0 auto 12px}
.tm{display:flex;justify-content:space-between;color:var(--m);font-size:12px}
/* Animations */
#hero{position:relative;height:240px;border-radius:18px;overflow:hidden;margin:6px 0;background:#111}
.sl{position:absolute;inset:0;opacity:0;transition:opacity 1s}.sl.on{opacity:1}
.sl .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.sl.on .bg{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.16)}}
.sl:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.92),rgba(0,0,0,.05) 70%)}
.sc{position:absolute;left:16px;right:16px;bottom:14px;z-index:2}.sc .m{padding:0;color:var(--g);font-size:12px;letter-spacing:1px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity}
.card{flex:none;width:136px;scroll-snap-align:start;animation:up .5s both}
.card .cv{width:136px;height:136px;border-radius:12px}
.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.card span{color:var(--m);font-size:12px;margin-top:0}
.pl{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:var(--g);color:#000;display:grid;place-items:center;font-size:12px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}.eq i{width:3px;background:var(--g);height:4px}
.playing .eq i{animation:eq .8s infinite ease-in-out}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{height:16px}}
.playing #scv{animation:glow 2.2s infinite ease-in-out}
@keyframes glow{50%{box-shadow:0 0 44px rgba(245,184,46,.5);transform:scale(1.03)}}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;background:var(--c2);border:0;border-radius:10px;padding:10px}
.seg .on{background:var(--g);color:#000;font-weight:700}
.vc{flex:none;width:200px;animation:up .5s both}.vc .cv{width:100%;height:auto;aspect-ratio:16/9;border-radius:12px}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.vg .vc{width:100%}
#vm{position:fixed;inset:0;background:#000;z-index:7;padding-top:env(safe-area-inset-top);overflow-y:auto}
#vm video,#vm iframe{width:100%;aspect-ratio:16/9;background:#000;border:0;display:block}
h2,.sc b,.tile b,#rd h2{font-family:Georgia,"Times New Roman",serif;font-weight:700}
.flag{height:4px;background:linear-gradient(90deg,#009e60 33.33%,#fcd116 33.33% 66.66%,#3a75c4 66.66%)}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.tile{background:var(--c);border:1px solid #2a2a2a;border-radius:14px;padding:14px 12px 16px;position:relative;overflow:hidden;min-height:78px}
.tile b{display:block;font-size:15px;margin-bottom:4px}.tile span{color:var(--m);font-size:12px}
.tile:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#009e60 33.33%,#fcd116 33.33% 66.66%,#3a75c4 66.66%)}
#rd{position:fixed;inset:0;background:#000;z-index:7;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 8px) 18px 30px}
#rd img{width:100%;border-radius:12px;margin:10px 0}#rd p{margin:10px 0;line-height:1.6;font-size:16px}#rd p.m{font-size:14px}
.bdg{display:inline-block;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700}
footer{padding:30px 0 0;text-align:center;color:var(--m);font-size:12px;line-height:1.7}
footer b{color:var(--g);display:block;font-size:15px;letter-spacing:1px}
footer a{color:#ccc;margin:0 6px;text-decoration:underline;white-space:nowrap;display:inline-block;padding:4px 0}

  const n=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let g=0;
  for(;;){const {done,value}=await rd.read();if(done)break;ch.push(value);g+=value.length;if(n)b.textContent=Math.round(g/n*100)+'%'}
  await dlPut({id,t,blob:new Blob(ch,{type:r.headers.get('content-type')||'audio/mpeg'}),size:g});DL.add(id);
  SB.from('downloads_log').insert({user_id:user.id,track_id:id}).then(()=>{});b.textContent='✓';b.classList.add('on');toast('Téléchargé : disponible hors ligne')
 }catch(e){b.textContent='⇩';toast('Échec du téléchargement : '+e.message)}}

/* ---------- Lecteur ---------- */
let pTok=0,rt=0;
async function playIdx(i){if(i<0||i>=Q.length)return;const tok=++pTok;rt=0;qi=i;cur=Q[i];let src;setUI();
 if(curUrl){URL.revokeObjectURL(curUrl);curUrl=null}
 if(cur.ext){if(!navigator.onLine)return toast('Hors connexion : ce titre nécessite Internet');src=cur.src}
 else{const loc=await dlGet(cur.id);
  if(loc){src=curUrl=URL.createObjectURL(loc.blob)}
  else{if(!navigator.onLine)return toast('Hors connexion : ce titre n’est pas téléchargé');const {data,error}=await SB.storage.from('audio').createSignedUrl(cur.path,3600);if(error)return toast('Lecture impossible : '+error.message);src=data.signedUrl;
   if(user)SB.from('plays').insert({user_id:user.id,track_id:cur.id}).then(()=>{})}}
 if(tok!==pTok)return;au.src=src;try{await au.play()}catch(e){if(tok!==pTok||e.name==='AbortError')return;toast('Lecture impossible : '+e.message)}setUI()}
function next(auto){if(!Q.length)return;if(shuf&&Q.length>1){let j;do{j=Math.floor(Math.random()*Q.length)}while(j===qi);return playIdx(j)}
 if(qi+1<Q.length)return playIdx(qi+1);if(rep===2||!auto)return playIdx(0)}
function prev(){if(au.currentTime>3)au.currentTime=0;else playIdx(qi>0?qi-1:0)}
function setUI(){if(!cur)return;$('#mini').hidden=false;const im=img(cur);
 $('#mcv').innerHTML=im;$('#scv').innerHTML=im;$('#mt').textContent=$('#st').textContent=cur.title;$('#ma').textContent=$('#sa').textContent=cur.artist;
 $('#sq').innerHTML=Q.map((t,i)=>`<div class="row" data-q="${i}"><div class="tx"><b ${i===qi?'style="color:var(--g)"':''}>${esc(t.title)}</b><span>${esc(t.artist)}</span></div></div>`).join('');
 if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:cur.title,artist:cur.artist,artwork:cur.cover?[{src:cur.cover}]:[{src:new URL('icon-512.png',location.href).href,sizes:'512x512',type:'image/png'}]})}}
au.addEventListener('timeupdate',()=>{const p=au.duration?au.currentTime/au.duration:0;$('#mbar').style.width=p*100+'%';$('#sk').value=p*1000;$('#tc').textContent=fmt(au.currentTime);$('#td').textContent=fmt(au.duration)});
au.addEventListener('ended',()=>{if(rep===1)playIdx(qi);else next(true)});
au.addEventListener('error',()=>{if(!au.src||!cur)return;if(rt<1){rt++;setTimeout(()=>{au.load();au.play().catch(()=>{})},700);return}rt=0;toast('Titre indisponible, passage au suivant…');setTimeout(()=>next(true),900)});
['play','pause'].forEach(ev=>au.addEventListener(ev,()=>{const s=au.paused?'▶':'⏸';$('#mpp').textContent=$('#spp').textContent=s;document.body.classList.toggle('playing',!au.paused);if('mediaSession' in navigator)navigator.mediaSession.playbackState=au.paused?'paused':'playing'}));
const tog=()=>au.src&&(au.paused?au.play():au.pause());
$('#mpp').onclick=$('#spp').onclick=tog;$('#mnx').onclick=$('#nx').onclick=()=>next(false);$('#pv').onclick=prev;
$('#sk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
$('#vo').oninput=e=>au.volume=e.target.value;
$('#sh').onclick=e=>{shuf=!shuf;e.target.classList.toggle('on',shuf)};
$('#rp').onclick=e=>{rep=(rep+1)%3;e.target.textContent=rep===1?'↻1':'↻';e.target.classList.toggle('on',rep>0)};
$('#sc').onclick=()=>$('#sheet').hidden=true;
$('#vx').onclick=()=>{$('#vbox').innerHTML='';$('#vm').hidden=true};
if('mediaSession' in navigator){const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};h('play',()=>au.play());h('pause',()=>au.pause());h('previoustrack',prev);h('nexttrack',()=>next(false));h('seekto',d=>{au.currentTime=d.seekTime})}

/* ---------- Espace administrateur ---------- */
const durOf=f=>new Promise(ok=>{const a=new Audio(),u=URL.createObjectURL(f);a.preload='metadata';a.onloadedmetadata=()=>{URL.revokeObjectURL(u);ok(Math.round(a.duration)||null)};a.onerror=()=>ok(null);a.src=u});
const mimeOf=f=>f.type||({mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',mp4:'audio/mp4'})[(f.name.split('.').pop()||'').toLowerCase()]||'application/octet-stream';
const safe=n=>n.normalize('NFD').replace(/[^\w.\-]+/g,'_');
async function publish(){const m=$('#am'),name=$('#aa').value.trim(),title=$('#at').value.trim(),af=$('#af').files[0],cf=$('#ac').files[0];
 if(!name||!title||!af)return m.textContent='Artiste, titre et fichier audio sont obligatoires.';
 $('#as').disabled=true;m.textContent='Envoi en cours… ne ferme pas la page.';
 try{let {data:a}=await SB.from('artists').select('id').eq('name',name).maybeSingle();
  if(!a){const r=await SB.from('artists').insert({name,status:'approved'}).select('id').single();if(r.error)throw r.error;a=r.data}
  const p=`${a.id}/${Date.now()}-`;
  const up=await SB.storage.from('audio').upload(p+safe(af.name),af,{contentType:mimeOf(af),cacheControl:'3600'});if(up.error)throw up.error;
  let cover=null;if(cf){const uc=await SB.storage.from('covers').upload(p+safe(cf.name),cf);if(uc.error)throw uc.error;cover=SB.storage.from('covers').getPublicUrl(uc.data.path).data.publicUrl}
  const ok=$('#ar').checked,ins=await SB.from('tracks').insert({artist_id:a.id,genre_id:+$('#ag').value,title,producer:$('#ap').value.trim()||null,duration_seconds:await durOf(af),cover_url:cover,audio_path:up.data.path,rights_confirmed:ok,downloadable:ok,status:'approved',published_at:new Date().toISOString()});
  if(ins.error)throw ins.error;m.textContent='✓ Titre publié.';['at','ap','af','ac'].forEach(i=>$('#'+i).value='');$('#afn').textContent='Aucun fichier choisi'
 }catch(e){m.textContent='Erreur : '+e.message}$('#as').disabled=false}

/* ---------- Clics ---------- */
document.addEventListener('click',e=>{const t=e.target;let b;
 if(b=t.closest('[data-login]')){$('#auth').hidden=false;return}
 if(b=t.closest('[data-xs]')){xs=b.dataset.xs;return render()}
 if(b=t.closest('[data-cat]')){cat=b.dataset.cat;return render()}
 if(t.closest('[data-back]')){cat=null;return render()}
 if(b=t.closest('[data-art]'))return openArt(b.dataset.art);
 if(b=t.closest('[data-legal]'))return openLegal(b.dataset.legal);
 if(t.closest('[data-report]'))return openReport();
 if(t.closest('#rx')){$('#rd').hidden=true;return}
 if(b=t.closest('[data-newart]')){presetCat=b.dataset.newart;editArt=null;tab='admin';$('#rd').hidden=true;return render()}
 if(b=t.closest('[data-editart]')){editArt=b.dataset.editart;tab='admin';$('#rd').hidden=true;return render()}
 if(b=t.closest('[data-delart]')){if(confirm('Supprimer ce dossier définitivement ?'))SB.from('articles').delete().eq('id',b.dataset.delart).then(()=>render());return}
 if(b=t.closest('[data-rep]')){SB.from('reports').update({handled:true}).eq('id',b.dataset.rep).then(()=>render());return}
 if(b=t.closest('[data-vid]'))return openVideo(b.dataset.vid);
 if(b=t.closest('[data-dl]'))return dl(b.dataset.dl,b);
 if(b=t.closest('[data-fav]'))return fav(b.dataset.fav);
 if(b=t.closest('[data-s]')){tab='explore';$$('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='explore'));const q=$('#q');if(q)q.value=b.dataset.s;return find(b.dataset.s)}
 if(b=t.closest('[data-go]')){tab=b.dataset.go;return render()}
 if(b=t.closest('#nav button')){tab=b.dataset.tab;cat=null;editArt=null;return render()}
 if(b=t.closest('[data-q]'))return playIdx(+b.dataset.q);
 if(b=t.closest('[data-play]')){const s=b.dataset.play,c=s.lastIndexOf(':');Q=[...L[s.slice(0,c)]];return playIdx(+s.slice(c+1))}
 if(t.closest('#mini')&&!t.closest('button'))$('#sheet').hidden=false});

/* ---------- Connexion (facultative) ---------- */
const am2=m=>$('#am2').textContent=m;
const cred=()=>{const email=$('#em').value.trim(),password=$('#pw').value;if(!email||!password){am2('Écris ton e-mail ET ton mot de passe, puis appuie à nouveau.');return null}if(password.length<6){am2('Le mot de passe doit avoir au moins 6 caractères.');return null}am2('Un instant…');return {email,password}};
$('#li').onclick=async()=>{const c=cred();if(!c)return;const {error}=await SB.auth.signInWithPassword(c);error?am2('Connexion impossible : '+error.message):boot()};
$('#su').onclick=async()=>{const c=cred();if(!c)return;const {data,error}=await SB.auth.signUp({...c,options:{data:{display_name:$('#nm').value.trim()}}});
 if(error)am2('Création impossible : '+error.message);else if(!data.session)am2('Compte créé. Vérifie ton e-mail, confirme, puis reviens te connecter.');else boot()};
$('#ax').onclick=()=>$('#auth').hidden=true;
SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){au.pause();$('#mini').hidden=true;boot()}});
async function boot(){const {data}=await SB.auth.getSession();user=data.session?.user||null;profile=null;FAV=new Set();
 if(user){try{const p=await SB.from('profiles').select('*').eq('id',user.id).single();profile=p.data;const f=await SB.from('favorites').select('track_id');FAV=new Set((f.data||[]).map(x=>x.track_id))}catch(e){}}
 $('#auth').hidden=true;$('#app').hidden=false;$('#hb').hidden=!!user;if(!navigator.onLine&&tab==='home')tab='dl';tab==='admin'&&profile?.role!=='admin'&&(tab='home');render()}
boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
